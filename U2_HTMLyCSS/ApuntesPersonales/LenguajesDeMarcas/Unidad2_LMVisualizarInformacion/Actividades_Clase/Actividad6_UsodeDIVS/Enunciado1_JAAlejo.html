<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enunciado 1 - Uso de DIVS</title>
</head>
<body style="margin: 0; font-family: sans-serif;">
    <div style="width: 100%; min-height: fit-content; background-color: gray; display: flex; justify-content: center; align-items: center; color: white; border: 1px solid black; padding: 20px; box-sizing: border-box;">
        <h1 style="margin: 0;">ENCABEZADO</h1>
    </div>
    <div style="width: 100%; min-height: fit-content; background-color: orange; display: flex; justify-content: center; align-items: center; color: white; border: 1px solid black; padding: 20px; box-sizing: border-box;">
        <h2 style="margin: 0;">MENÚ</h2>
    </div>

    <div style="min-height: fit-content; min-width: fit-content; background-color: darkblue; padding: 20px; color: white; border: 1px solid black; box-sizing: border-box;">
        <h3 style="margin: 0 0 10px 0;"><ins>SECCIÓN</ins></h3>

        <div style="display: flex; min-height: fit-content; width: 100%; flex-wrap: wrap;">
            <div style="flex: 4; min-width: 200px; height: 200px; background-color: cyan; display: flex; justify-content: center; align-items: center; border: 1px solid black; box-sizing: border-box; margin-right: 10px; font-size: larger;">
                <h4 style="margin: 0;">ARTICULO 1</h4>
            </div>
            <div style="flex: 1; min-width: 100px; height: 200px; background-color: green; display: flex; justify-content: center; align-items: center; border: 1px solid black; box-sizing: border-box; font-size: larger;">
                <h4 style="margin: 0;">BARRA DERECHA</h4>
            </div>
        </div>
    </div>

    <div style="width: 100%; min-height: fit-content; background-color: black; display: flex; justify-content: center; align-items: center; border: 1px solid black; padding: 20px; box-sizing: border-box;">
        <h2 style="color: white; margin: 0;">PIE</h2>
    </div>

</body>
</html>
