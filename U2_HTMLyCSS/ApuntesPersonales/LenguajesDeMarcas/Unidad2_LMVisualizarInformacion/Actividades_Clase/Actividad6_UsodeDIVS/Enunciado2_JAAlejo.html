<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enunciado 2 - Uso de DIVS</title>
</head>
<body>
    <div style="height: 800px; width: 1000px;">
        <div style="width: 100%; height: fit-content; background-color: gray; display: flex; justify-content: center; align-items: center; color: white; border: 3px solid black;">
            <h1> ENCABEZADO</h1>
        </div>
        <div style="width: 100%; height: fit-content; background-color: orange; display: flex; justify-content: center; align-items: center; color: white; border: 3px solid black;">
            <h2> MENÚ</h2>
        </div>

        <div style="width:100%; height: 600px; min-width:fit-content; color:white; border: 3px solid black; display: column;">

            <div style="width: 40%; height: 100%; background-color: green; float: left; display: flex; justify-content: center; align-items: center;">
                <h3>BARRA IZQUIERDA</h3>
            </div>
            <div style="width: 60%; height: 50%; background-color: darkblue; float: right; display: flex; justify-content: center; align-items: center;">
                <h3>SECCIÓN 1</h3>
            </div>
            <div style="width: 60%; height: 50%; background-color: cyan; float: right; display: flex; justify-content: center; align-items: center;">
                <h3>ARTICULO 1</h3>
            </div>
                
        </div>

        <div style="width: 100%; height: fit-content; background-color: black; display: flex; justify-content: center; border: 3px solid black;">
            <h2 style="color: white;"> PIE</h2>
        </div>
    </div>
</body>
</html>
