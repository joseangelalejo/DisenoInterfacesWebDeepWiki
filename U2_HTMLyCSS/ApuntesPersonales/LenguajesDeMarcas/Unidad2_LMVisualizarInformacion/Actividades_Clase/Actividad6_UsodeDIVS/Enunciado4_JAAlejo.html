<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enunciado4_JAAlejo</title>
</head>
<body style="margin:0; font-family:sans-serif; font-size: larger; text-align:center; color:white;">

  <!-- ENCABEZADO -->
  <div style="background-color: gray; padding: 20px; font-weight: bold; border: 1px solid black; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; margin-top: 10px">
    ENCABEZADO
  </div>

  <!-- MENÚ -->
  <div style="background-color: orange; padding: 20px; font-weight: bold; border: 1px solid black; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
    MENÚ
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div style="background-color: deepskyblue;display: flex;flex-direction: column;border: 1px solid black;padding: 20px;gap: 20px; margin-bottom: 10px;">
     <p style="font-weight: bold; text-align: left; margin: 0;">ARTÍCULO 1</p>

    <!-- CONTENEDOR PARA SECCIÓN 1 Y BLOQUE -->
    <div style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: flex-start; align-items: center; gap: 20px;">
      <!-- ARTÍCULO 1 -->
        <div style="background-color: blue; flex: 1 1 auto; min-width: 200px; min-height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center;">
          SECCIÓN 1
        </div>

      <!-- BLOQUE -->
      <div style="background-color: green; flex: 1 1 200px; border: 1px solid black; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 20px;">
        <div style="font-weight: bold;">BLOQUE</div>

        <!-- SECCIÓN 2 -->
        <div style="background-color: blue; flex: 1 1 auto; min-width: 200px; min-height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center;">
          SECCIÓN 2
        </div>
      </div>
    </div>

  </div>

  <!-- PIE -->
  <div style="background-color: black; padding: 20px; font-weight: bold; border: 1px solid black; display: flex; align-items: center; justify-content: center;">
    PIE
  </div>

</body>
</html>
