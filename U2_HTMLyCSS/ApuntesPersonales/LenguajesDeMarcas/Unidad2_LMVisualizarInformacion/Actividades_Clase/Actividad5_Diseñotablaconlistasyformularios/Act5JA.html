<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table style="background-color: lightblue; width: fit-content; border: 3px solid black; border-collapse: separate; border-spacing: 4px; min-width: 590px; min-height: 350px;">
        <caption>Tabla con formularios y listas</caption>

        <thead style="background-color: lightsalmon; text-align: center;">
            <tr>
                <th colspan="3" style="border: 3px solid black; border-collapse: separate;"><b>LISTAS</b></th>
            </tr>
            
            <tr>
                <th style="border: 3px solid black; border-collapse: separate;"> Lista ordenada </th>
                <th style="border: 3px solid black; border-collapse: separate;"> Lista desordenada </th>
                <th style="border: 3px solid black; border-collapse: separate;"> Lista de definiciones</th>
            </tr>
        </thead>

        <tbody>
            <th style="background-color: violet; border: 3px solid black; border-collapse: separate; text-align: center;">
                <ol type ="1">
                    <li>Hola 1</li>
                    <li>Hola 2</li>
                    <li>Hola 3</li>
                </ol>
            </th>
            
            <th style="background-color: violet; border: 3px solid black; border-collapse: separate; text-align: left;">
                <ul type="disc">
                    <li>Adiós A</li>
                    <li>Adiós B</li>
                    <li>Adiós C</li>
                </ul>
            </th>

            <th style="background-color: violet; border: 3px solid black; border-collapse: separate; text-align: center;">
                <dl type="text">
                    <dt>Término 1</dt>
                    <dd>Definición 1</dd>
                    <dt>Término 2</dt>
                    <dd>Definición 2</dd>
                </dl>
            </th>
        </tbody>

        <thead style="background-color: lightsalmon; text-align: center; border: 3px solid black; border-collapse: separate;">
            <tr>
                <th colspan="3" style="border: 3px solid black; border-collapse: separate; text-align: center;">FORMULARIO</th>
            </tr>
            
            <tr>
                <th style="border: 3px solid black; border-collapse: separate; text-align: center;"> LOGIN </th>
                <th colspan="2" style="border: 3px solid black; border-collapse: separate; text-align: center;"> Selecciona una opción</th>
            </tr>
        </thead>

        <tbody>
            <th style="background-color: violet; border: 3px solid black; border-collapse: separate; text-align: center;">
                <select style="text-align: center;">
                    <option value="opcion1">Login Google</option>
                    <option value="opcion2">Login Correo electrónico</option>
                </select>
                <form style="text-align: center;">
                    <label for="login">Usuario:</label>
                    <input type="text" id="login" name="login" placeholder="Introduce tu usuario">
                    <br>
                    <label for="login">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Introduce tu contraseña">
                    <br>
                    <input type="submit" value="Iniciar sesión">
                </form>
            </th>

            <th colspan="2" style="background-color: violet; border: 3px solid black; border-collapse: separate; text-align: center;">
                <input type="radio" id="opcion1" name="opciones" value="opcion1">
                <label for="opcion1">Jose Angel</label><br>
                <input type="radio" id="opcion2" name="opciones" value="opcion2">
                <label for="opcion2">Javier</label><br>
                <input type="radio" id="opcion3" name="opciones" value="opcion3">
                <label for="opcion3">Marta</label> <br>
                <input type="submit" value="Iniciar sesión">
            </th>
        </tbody>
    </table>
</body>
</html>
