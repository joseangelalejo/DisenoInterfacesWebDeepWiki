<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuntes Grid y Media Queries 12/12/25</title>
    <!-- Hoja de estilo Interna con CSS-->
    <style>
        /* Los Media Queries deben ir al principio o al final del CSS.
        Se usan para definir estilos específicos según las características del dispositivo (ancho, alto, orientación, resolución, etc.)
        Entre paréntesis va la condición que debe cumplirse para aplicar los estilos indicados
        */
        @media (orientation: landscape) {   /*  Cuando la orientación se pone horizontal */
            body {
                background-color: lightgreen;
            }
        }
        @media (orientation: portrait) {    /*  Cuando la orientación se pone vertical */
            body {
                background-color: coral;
            }
        }
        @media (min-width: 500px) {        /*  Cuando el ancho de la pantalla es mayor o igual a 500px */
            body {
                /*background-color: yellow;*/
            }
        }
        @media (max-width: 500px) {        /*  Cuando el ancho de la pantalla es menor o igual a 500px */
            body {
                /*background-color: orange;*/
            }
        }
        
        /*  Grid Layout: Definición de una cuadrícula para distribuir elementos en filas y columnas */
        .divpadre {
            border: 10px solid black;
            height: fit-content;
            max-height: 1500px;
            display: grid;
            grid-template-columns: 1fr 50% 1fr 1fr;
            grid-template-rows: 1fr 2fr 1fr 1fr;
            padding: 8px;
            row-gap: 3px;
            column-gap: 8px;
        }
        .caja {
            background-color: lightblue;
            height: fit-content;
            max-height: 150px;
            border: 3px solid red;
            font-size: 20px;
            display: flex;          /*   Flexbox para centrar el contenido */
            justify-content: center;
            align-items: center;
        }
        /*  Si queremos agrupar celdas, debemos crear un elemento que abarque varias celdas */
        .caja2 {
            grid-column: 3 / 5; /*   Desde la columna 3 hasta la 4 (inclusive)  */
            grid-row: 1 / 3;    /*   Desde la fila 1(en la que se encuentra) hasta la 2 (inclusive)      */
            background-color: rosybrown;
            border: 3px solid red;
            font-size: 20px;
            display: flex;          /*   Flexbox para centrar el contenido */
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- Div para matriz 3x3-->
    <div class="divpadre">
        <!-- Divs hijos | Fila 1    -->
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja2">3</div>
        <div class="caja">4</div>
        <!-- Divs hijos | Fila 2    -->
        <div class="caja">5</div>
        <div class="caja">6</div>
        <div class="caja">7</div>
        <div class="caja">8</div>
        <!-- Divs hijos | Fila 3    -->
        <div class="caja">9</div>
        <div class="caja">10</div>
        <div class="caja">11</div>
        <div class="caja">12</div>
        <!-- Divs hijos | Fila 4    -->
        <div class="caja">13</div>
        <div class="caja">14</div>
        <div class="caja">15</div>
        <div class="caja">16</div>
    </div>
</body>
</html>
