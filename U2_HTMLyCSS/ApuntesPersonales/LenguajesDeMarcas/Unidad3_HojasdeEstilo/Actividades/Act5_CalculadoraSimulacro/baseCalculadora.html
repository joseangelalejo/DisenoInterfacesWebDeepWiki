<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>

</head>
<body>

<div>

    <h1>Calculadora</h1>

    <input type="text"  placeholder="0">

    <div class="teclado">
        <button >7</button>
        <button >8</button>
        <button >9</button>
        <button >/</button>

        <button >4</button>
        <button >5</button>
        <button >6</button>
        <button >*</button>

        <button >1</button>
        <button >2</button>
        <button >3</button>
        <button >-</button>

        <button >0</button>
        <button >C</button>
        <button >+</button>
        <button >=</button>
    </div>
</div>

</body>
</html>
