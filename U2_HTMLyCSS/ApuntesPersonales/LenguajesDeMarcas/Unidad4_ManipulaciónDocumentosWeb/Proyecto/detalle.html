<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Detalle | CineVault</title>
        <link rel="stylesheet" href="styles.css" />
        <style>
            .detail-wrap {
                max-width: 1100px;
                margin: 0 auto;
                padding: 2rem 2.5rem 3rem;
            }

            .back-link {
                display: inline-block;
                margin-bottom: 1.2rem;
                color: var(--accent);
                text-decoration: none;
                font-weight: 600;
            }

            .detail-card {
                display: grid;
                grid-template-columns: 280px 1fr;
                gap: 1.5rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 1rem;
            }

            .detail-poster {
                width: 100%;
                border-radius: 10px;
                border: 1px solid var(--border);
                object-fit: cover;
                aspect-ratio: 2 / 3;
                background: var(--bg);
            }

            .detail-title {
                font-family: 'DM Serif Display', serif;
                font-size: 2rem;
                margin-bottom: 0.5rem;
            }

            .detail-meta {
                color: var(--muted);
                margin-bottom: 1rem;
            }

            .detail-synopsis {
                color: #b0bac8;
                line-height: 1.7;
                margin-bottom: 1rem;
            }

            .detail-actors {
                margin-bottom: 1rem;
            }

            .detail-cast-grid {
                display: flex;
                gap: 0.8rem;
                overflow-x: auto;
                padding: 0.6rem 0 0.2rem;
                scrollbar-width: thin;
            }

            .detail-cast-item {
                flex-shrink: 0;
                width: 84px;
                text-align: center;
            }

            .detail-cast-avatar {
                width: 68px;
                height: 68px;
                border-radius: 50%;
                object-fit: cover;
                background: var(--bg);
                border: 2px solid var(--border);
                margin: 0 auto 0.45rem;
                display: block;
            }

            .detail-cast-name {
                font-size: 0.72rem;
                color: var(--muted);
                line-height: 1.3;
            }

            .detail-trailer {
                width: 100%;
                aspect-ratio: 16 / 9;
                border: 0;
                border-radius: 10px;
                margin-top: 0.5rem;
            }

            .error-box {
                border: 1px dashed var(--border);
                border-radius: 12px;
                padding: 1rem;
                color: var(--muted);
            }

            @media (max-width: 820px) {
                .detail-wrap {
                    padding: 1rem;
                }

                .detail-card {
                    grid-template-columns: 1fr;
                }

                .detail-title {
                    font-size: 1.5rem;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <a class="logo" href="index.html"><span>CINE</span>VAULT</a>
        </header>

        <main class="detail-wrap">
            <a class="back-link" href="index.html">← Volver al catálogo</a>
            <div id="detail-root" class="error-box">Cargando detalle...</div>
        </main>

        <script>
            const params = new URLSearchParams(window.location.search);
            const idParam = Number(params.get('id'));

            function toEmbedUrl(trailer) {
                if (!trailer) return '';
                if (trailer.includes('embed/')) return trailer;
                const match = trailer.match(/[?&]v=([^&]+)/);
                return match ? `https://www.youtube.com/embed/${match[1]}` : trailer;
            }

            function renderError(msg) {
                document.getElementById('detail-root').innerHTML = `<div class="error-box">${msg}</div>`;
            }

            fetch('peliculas.json')
                .then(r => {
                    if (!r.ok) throw new Error('No se pudo cargar peliculas.json');
                    return r.json();
                })
                .then(data => {
                    if (!Array.isArray(data)) throw new Error('Formato JSON inválido');

                    const item = data.find(p => Number(p.id) === idParam);
                    if (!item) {
                        renderError('No se encontró la película o serie solicitada.');
                        return;
                    }

                    const titulo = item.titulo || 'Sin título';
                    const año = item.año || 'N/D';
                    const sinopsis = item.sinopsis || item.descripcion || 'Sin sinopsis.';
                    const caratula = item.caratula || item.poster || '';
                    const repartoDetalle = Array.isArray(item.reparto)
                        ? item.reparto.map(actor => {
                            if (typeof actor === 'string') {
                                return {
                                    nombre: actor,
                                    avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(actor)}&background=1e2a3a&color=e8eaf0&size=128`
                                };
                            }

                            const nombre = actor?.nombre || 'N/D';
                            const avatar = actor?.avatar
                                || `https://ui-avatars.com/api/?name=${encodeURIComponent(nombre)}&background=1e2a3a&color=e8eaf0&size=128`;

                            return { nombre, avatar };
                        })
                        : [];

                    const actores = Array.isArray(item.actores) && item.actores.length
                        ? item.actores
                        : repartoDetalle.map(a => a.nombre);
                    const trailer = item.trailer || (item.trailerKey ? `https://www.youtube.com/watch?v=${item.trailerKey}` : '');
                    const trailerEmbed = toEmbedUrl(trailer);

                    document.title = `${titulo} | CineVault`;

                    document.getElementById('detail-root').innerHTML = `
                        <section class="detail-card">
                            <img class="detail-poster" src="${caratula}" alt="Carátula de ${titulo}" />
                            <div>
                                <h1 class="detail-title">${titulo}</h1>
                                <p class="detail-meta">Año: ${año}</p>

                                <h3>Sinopsis</h3>
                                <p class="detail-synopsis">${sinopsis}</p>

                                <div class="detail-actors">
                                    <h3>Actores</h3>
                                    ${repartoDetalle.length
                                        ? `<div class="detail-cast-grid">${repartoDetalle.map(actor => `
                                            <div class="detail-cast-item">
                                                <img class="detail-cast-avatar" src="${actor.avatar}" alt="${actor.nombre}" loading="lazy" />
                                                <div class="detail-cast-name">${actor.nombre}</div>
                                            </div>
                                        `).join('')}</div>`
                                        : actores.length
                                            ? `<p>${actores.join(', ')}</p>`
                                        : '<p>Sin datos de actores.</p>'}
                                </div>

                                <div>
                                    <h3>Tráiler</h3>
                                    ${trailerEmbed
                                        ? `<iframe class="detail-trailer" src="${trailerEmbed}" title="Tráiler de ${titulo}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
                                        : '<p>Tráiler no disponible.</p>'}
                                </div>
                            </div>
                        </section>
                    `;
                })
                .catch(() => {
                    renderError('Error cargando el detalle.');
                });
        </script>
    </body>
</html>
