<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora | José Ángel Alejo </title>
    <style>
        /* Estilos para el cuerpo de la página */
        body {
            font-family: Arial, sans-serif; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; /* Altura completa de la ventana */
            background-image: url('background.jpg');
            background-size: cover; background-position: center;
        }
        /* Estilos para el div principal */
        div {
            background-color: rgb(100, 99, 99); opacity: 0.98;
            padding: 20px; box-shadow: 0 0 10px lightblue;
            border: 3px solid black; border-radius: 10px;
            flex-basis: 300px; flex-grow: 0; flex-shrink: 1;
        }
        /* Estilos para el título */
        h1 {
            text-align: center; text-transform: uppercase;
            margin-bottom: 20px;
        }
        /* Estilos para el campo de texto */
        input[type="text"] {
            width: 100%; height: 40px;
            font-size: 24px; text-align: right;
            margin-bottom: 20px; padding: 5px;
            box-sizing: border-box; border: 3px solid #000000e5; border-radius: 7px;
        }
        input[type="text"]:focus {
            background-color: rgb(127, 241, 222);
        }
        /* Estilos para el div del teclado */
        .teclado {
            display: grid;
            grid-template-columns: repeat(4, 1fr); grid-gap: 10px 10px;
            flex-basis: auto; flex-grow: 1; flex-shrink: 1;
            background-color: rgb(128, 128, 128);
            opacity: inherit;   /* Hereda del div principal */
        }
        /* Estilos para los botones (general) */
        button {
            height: 50px; cursor: pointer; border-radius: 5px;
            flex-grow: 1; flex-shrink: 1;
            font-size: 18px; color: white;
            background-color: #007BFF;
        }
        button:hover {
            background-color: #00b3aa;
            font-size: 22px; text-decoration-line: underline;
        }
        button:focus {
            background-color: #1ffc56;
        }
        /* Estilos para los botones de operaciones */
        .teclado button:nth-child(4n){
            background-color: #d8b43e;
        }
        .teclado button:nth-child(4n):hover{
            background-color: #e6937a;
        }
        .teclado button:nth-child(4n):focus {
            background-color: #ff951c;
            background-color: #ff5100;
        }
        /* Estilo especial para el botón "=" */
        .teclado button:nth-child(17){
            background-color: #ff8800;
            grid-column: 3/5; height: 35px; border-radius: 25px;
        }
    </style>
</head>
<body>
    <div>
        <h1>Calculadora</h1>
        <input id="pantalla" type="text"  placeholder="0">
        <div class="teclado">
            <button onclick="agregarValor('7')">7</button>  <button onclick="agregarValor('8')">8</button>  <button onclick="agregarValor('9')">9</button>  <button onclick="agregarValor('/')">​/</button>
            <button onclick="agregarValor('4')">4</button>  <button onclick="agregarValor('5')">5</button>  <button onclick="agregarValor('6')">6</button>  <button onclick="agregarValor('*')">*</button>
            <button onclick="agregarValor('1')">1</button>  <button onclick="agregarValor('2')">2</button>  <button onclick="agregarValor('3')">3</button>  <button onclick="agregarValor('-')">-</button>
            <button onclick="agregarValor('0')">0</button>  <button onclick="limpiar()">C</button>  <button onclick="borrar()">⌫</button>  <button onclick="agregarValor('+')">+</button>
            <button onclick="calcular()">=</button>
        </div>
    </div>
    <script>
        // Variables globales para la calculadora
        var num1 = 0;
        var num2 = 0;
        var operacion = '';
        var operacionActiva = false;
        
        // Función para agregar valores a la pantalla
        function agregarValor(valor) {
            var pantalla = document.getElementById("pantalla");
            
            // Si es una operación
            if (valor === '+' || valor === '-' || valor === '*' || valor === '/') {
                if (pantalla.value !== '') {
                    num1 = parseFloat(pantalla.value);
                    operacion = valor;
                    operacionActiva = true;
                    pantalla.value = '';
                }
            } else {
                // Si es un número
                pantalla.value += valor;
            }
        }
        
        // Función para limpiar la pantalla
        function limpiar() {
            document.getElementById("pantalla").value = '';
            num1 = 0;
            num2 = 0;
            operacion = '';
            operacionActiva = false;
        }
        
        // Función para borrar el último carácter
        function borrar() {
            var pantalla = document.getElementById("pantalla");
            pantalla.value = pantalla.value.substring(0, pantalla.value.length - 1);
            // Se puede utilizar el método "slice" en lugar de "substring",sería "pantalla.value = pantalla.value.slice(0, -1);"
        }
        
        // Función para calcular el resultado
        function calcular() {
            var pantalla = document.getElementById("pantalla");
            var resultado = 0;
            
            if (pantalla.value !== '' && operacionActiva) {
                num2 = parseFloat(pantalla.value);
                
                // Switch para realizar la operación según el operador
                switch (operacion) {
                    case '+':
                        resultado = num1 + num2;
                        break;
                    case '-':
                        resultado = num1 - num2;
                        break;
                    case '*':
                        resultado = num1 * num2;
                        break;
                    case '/':
                        if (num2 !== 0) {
                            resultado = num1 / num2;
                        } else {
                            pantalla.value = 'Error';
                            return;
                        }
                        break;
                    default:
                        resultado = num1;
                }
                
                pantalla.value = resultado;
                num1 = resultado;
                num2 = 0;
                operacion = '';
                operacionActiva = false;
            }
        }
    </script>
</body>
</html>
